name: sync-once
on:
  push:
    branches: [fix-e-veo-retry]
    paths: ['.github/workflows/sync-once.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tarball
        run: |
          curl -sSL -o /tmp/fixe.tgz "https://backend.composio.dev/api/v3/sl/cs4i4OqgNr"
          echo "3f6a9f471d69033f775c4a3bc9f0955cc576b61f64f9ae49f672e13d76a26624  /tmp/fixe.tgz" | sha256sum -c -
          tar xzf /tmp/fixe.tgz -C .
          git config user.name "creativeflow-bot"
          git config user.email "bot@creativeflow.local"
          git add -A
          git rm -f .github/workflows/sync-once.yml
          git commit -m "Fix E: pin veo-3.1-lite model, bounded 429 retry with injectable sleep, preserve sanitized quota errors, retry tests"
          git push
