name: sync-once
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: composio-sessions
      - name: apply payload
        run: |
          curl -sSL -o /tmp/p.tar.gz "https://backend.composio.dev/api/v3/sl/7d0Y0tPoNL"
          echo "664f86b4a9f4d700abb25cbf179dba9c26d4522af2f546563b36635a409c1eef  /tmp/p.tar.gz" | sha256sum -c -
          tar xzf /tmp/p.tar.gz -C .
          git config user.name "creativeflow-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git rm -f .github/workflows/sync-once.yml
          git commit -m "feat(video): Composio SDK session-based MCP for Gemini/Veo

- new backend/src/services/composioSession.ts (session factory, @composio/core)
- videoService.ts: McpToolClient using session.mcp.url/headers; drop connect.composio.dev + x-consumer-api-key transport
- one Composio session per CreativeFlow session, reused across polls
- tests: new videoSession.test.ts (3), updated videoFrontend mcp test; 46/46 pass
- deps: @composio/core ^0.16.0; render.yaml buildCommand npm install --omit=dev
- docs: .env.example Composio project-key notes"
          git push origin composio-sessions
