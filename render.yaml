# Render blueprint for CreativeFlow.
#
# Single web service: the Node backend serves both the API (/api/*) and the
# static frontend (frontend/public). No build step is required — the backend
# is dependency-free TypeScript executed natively by Node >= 22.18.
#
# If the frontend is ever split into its own static site, set
# window.CREATIVEFLOW_API_URL in frontend/public/js/config.js (see
# frontend/README notes) to point at this service's URL.

services:
  - type: web
    name: creativeflow
    runtime: node
    plan: free
    buildCommand: "npm install --omit=dev"
    startCommand: "node backend/src/server.ts"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      # Provider mode matrix — override in the dashboard when needed:
      #   VOICE_PROVIDER: browser (default, free Web Speech API) | simulation
      #   COPILOT_PROVIDER: mock | live (live needs COPILOT_WORKFLOW_URL)
      - key: VOICE_PROVIDER
        sync: false
      - key: COPILOT_PROVIDER
        sync: false
      # Conversational brain (live mode): Activepieces /sync → Groq.
      # Set real values in the dashboard.
      - key: COPILOT_WORKFLOW_URL
        sync: false
      - key: COPILOT_AUTH_TOKEN
        sync: false
      - key: COPILOT_LLM_API_KEY
        sync: false
      # Natural TTS (POST /api/tts). Keys stay server-side — the browser
      # never sees them. Auto-detects elevenlabs when ELEVENLABS_API_KEY is
      # set (plain text-to-speech endpoint ONLY — the conversational agent
      # stays retired; ELEVENLABS_AGENT_ID is unused and can be deleted).
      - key: TTS_PROVIDER
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: TTS_VOICE_ID
        sync: false
      - key: TTS_MODEL
        sync: false
      - key: TTS_API_URL
        sync: false
      - key: TTS_API_KEY
        sync: false
      - key: TTS_VOICE
        sync: false
      # Provider keys for future integrations. Set real values in the
      # Render dashboard; they stay server-side and are never exposed
      # to the browser.
      - key: GEMINI_API_KEY
        sync: false
      # COMPOSIO_API_KEY: Composio *project* API key (platform.composio.dev
      # -> Settings -> API Keys), used server-side by @composio/core. Video
      # generation creates a Composio session (gemini toolkit, direct_tools
      # preset) and calls Veo via the session-provided MCP url/headers.
      - key: COMPOSIO_API_KEY
        sync: false
      # Video generation provider: composio (real Veo) or mock. Auto-detects
      # composio when COMPOSIO_API_KEY is set; set explicitly to pin.
      - key: VIDEO_GEN_PROVIDER
        sync: false
